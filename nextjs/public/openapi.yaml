  # ─── YouTube Comments ───────────────────────────────────────

  /youtube/comments:
    get:
      operationId: searchChannelComments
      summary: Search a channel's comments
      description: |
        Searches every comment thread related to a channel, narrowed by `searchTerms`
        when given. This is the discovery step of a link sweep: search for the old URL,
        review the matches, then send the comment IDs to `POST /youtube/comments/bulk-update`.

        VidTempla stores no comment state, so every call re-reads YouTube live.
      tags: [YouTube Comments]
      x-quota-cost: 1
      parameters:
        - name: channelId
          in: query
          required: true
          schema:
            type: string
          description: YouTube channel ID (UC...) of a connected channel
        - name: searchTerms
          in: query
          schema:
            type: string
          description: Return only threads whose text matches these terms, such as the URL being replaced
        - name: maxResults
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Max results per page (max 100)
        - name: order
          in: query
          schema:
            type: string
            enum: [relevance, time]
            default: relevance
          description: Sort order (relevance for top comments, time for newest)
        - name: cursor
          in: query
          schema:
            type: string
          description: Pagination token from the previous page's meta.cursor
      responses:
        "200":
          description: Matching comment threads
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      description: YouTube commentThread resource
                  error:
                    type: "null"
                  meta:
                    type: object
                    properties:
                      cursor:
                        type: string
                        nullable: true
                        description: Pass as ?cursor= for the next page. Null on the last page.
                      hasMore:
                        type: boolean
                      total:
                        type: integer
                        nullable: true
                        description: Always null. YouTube reports no total for a comment search.
                      quotaUnits:
                        type: integer
                        example: 1
        "400":
          description: Missing channelId, invalid parameters, or a channelId that is not a UC... ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/QuotaExceeded"
        "500":
          $ref: "#/components/responses/InternalError"

  /youtube/comments/{id}:
    get:
      operationId: listComments
      summary: List video comments
      description: Lists comment threads for a YouTube video. The `{id}` is a YouTube video ID.
      tags: [YouTube Comments]
      x-quota-cost: 1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: YouTube video ID (for listing comments) or YouTube comment ID (for deletion)
        - name: channelId
          in: query
          required: true
          schema:
            type: string
          description: YouTube channel ID (for auth)
        - name: maxResults
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Max results per page (max 100)
        - name: order
          in: query
          schema:
            type: string
            enum: [relevance, time]
            default: relevance
          description: Sort order (relevance for top comments, time for newest)
        - name: cursor
          in: query
          schema:
            type: string
          description: Pagination token from the previous page's meta.cursor
        - name: pageToken
          in: query
          schema:
            type: string
          description: Alias of cursor, kept for backwards compatibility
      responses:
        "200":
          description: List of comment threads
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      description: YouTube commentThread resource
                  error:
                    type: "null"
                  meta:
                    type: object
                    properties:
                      cursor:
                        type: string
                        nullable: true
                        description: Pass as ?cursor= for the next page. Null on the last page.
                      hasMore:
                        type: boolean
                      total:
                        type: integer
                        nullable: true
                        description: Always null. YouTube reports no total for a comment listing.
                      quotaUnits:
                        type: integer
                        example: 1
        "400":
          description: Missing channelId or invalid order parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/QuotaExceeded"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteComment
      summary: Delete a comment
      description: |
        Deletes a YouTube comment permanently. The `{id}` is a YouTube comment ID.

        The comment's text is snapshotted to the edit log before the delete, because
        YouTube keeps no comment history and a deleted comment cannot be re-found —
        that row is the only surviving copy. Read it back with `GET /youtube/comments/edits`.
        For a comment the acting channel did not write, YouTube returns only the
        HTML-marked-up `textDisplay`, so the snapshot is an audit record, not a
        restorable copy.
      tags: [YouTube Comments]
      x-quota-cost: 51
      x-requires-write: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: YouTube comment ID
        - name: channelId
          in: query
          required: true
          schema:
            type: string
          description: YouTube channel ID (UC...) whose token signs the delete
        - name: videoId
          in: query
          schema:
            type: string
          description: Video the comment sits on, recorded on the edit-log row when known
      responses:
        "200":
          description: Comment deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted:
                        type: boolean
                        example: true
                      editId:
                        type: string
                        format: uuid
                        description: Edit-log row holding the comment's text as it was before the delete
                  error:
                    type: "null"
                  meta:
                    type: object
                    properties:
                      quotaUnits:
                        type: integer
                        example: 51
        "400":
          description: Missing channelId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRoleRequired"
        "404":
          description: The comment or the channel was not found. Nothing was written to YouTube.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/QuotaExceeded"
        "500":
          $ref: "#/components/responses/InternalError"

  /youtube/comments/reply:
    post:
      operationId: replyToComment
      summary: Reply to a comment
      description: |
        Posts a reply to an existing YouTube comment. A reply is new content, so no
        edit-log row is written — only updates and deletes are snapshotted.
      tags: [YouTube Comments]
      x-quota-cost: 50
      x-requires-write: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId, parentId, text]
              properties:
                channelId:
                  type: string
                  description: YouTube channel ID
                parentId:
                  type: string
                  description: The comment ID to reply to
                text:
                  type: string
                  description: Reply text
            example:
              channelId: "UCxxxxxxxxxxxxxxxxxxxxxx"
              parentId: "UgxAbCdEfGhIjKlMnOp"
              text: "Thanks for watching! Glad you enjoyed it."
      responses:
        "200":
          description: Reply posted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: YouTube comment resource
                  error:
                    type: "null"
                  meta:
                    type: object
                    properties:
                      quotaUnits:
                        type: integer
                        example: 50
        "400":
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientPermissions"
        "429":
          $ref: "#/components/responses/QuotaExceeded"
        "500":
          $ref: "#/components/responses/InternalError"

  /youtube/comments/bulk-update:
    post:
      operationId: bulkUpdateComments
      summary: Rewrite up to 40 comments
      description: |
        Rewrites the text of up to 40 comments authored by one channel in a single call —
        the way to replace a link everywhere it appears. Find the comments first with
        `GET /youtube/comments?searchTerms=...`, then send the IDs you chose.

        Comments are edited in place. Delete-and-repost would unpin them and discard
        their likes and original timestamps, so it is never done.

        The batch runs in three phases. It first reconciles any rows left `pending` by an
        interrupted earlier batch for the same channel; then it snapshots and validates
        every item; then it writes. If any comment is missing or was not authored by
        `channelId`, the batch aborts and **nothing** is written to YouTube.

        Three conditions stop a batch mid-write. In each case earlier items stay applied,
        the failing item carries the reason, and the rest come back as `skipped` — never
        attempted and never billed. `halted` says which one it was, and the skipped IDs
        are what you resend to resume:

        - `quota` — the YouTube *daily* quota is exhausted. Terminal until the Pacific
          midnight reset, whose time is in `resetsAt`. The item's error is `QUOTA_EXCEEDED`.
        - `rateLimit` — a short-term YouTube throttle, not the daily quota. There is no
          `resetsAt`, because waiting about a minute is enough. The item's error is
          `RATE_LIMITED`.
        - `credits` — the workspace ran out of plan credits. Nothing to do with YouTube.
        - `timeBudget` — the batch ran out of wall clock and stopped itself rather than be
          killed mid-write. Resend the skipped IDs in a smaller batch.

        Split larger sweeps into batches of 40 and loop.
      tags: [YouTube Comments]
      x-quota-cost: 51
      x-requires-write: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId, items]
              properties:
                channelId:
                  type: string
                  description: YouTube channel ID (UC...) that authored every comment in the batch
                items:
                  type: array
                  minItems: 1
                  maxItems: 40
                  items:
                    type: object
                    required: [id, text]
                    properties:
                      id:
                        type: string
                        description: YouTube comment ID
                      videoId:
                        type: string
                        description: Video the comment sits on, recorded on the edit-log row when known
                      text:
                        type: string
                        description: Replacement text for this comment
            example:
              channelId: "UCxxxxxxxxxxxxxxxxxxxxxx"
              items:
                - id: "UgxAbCdEfGhIjKlMnOp"
                  videoId: "dQw4w9WgXcQ"
                  text: "Course link updated: https://example.com/course"
      responses:
        "200":
          description: Batch finished. Inspect every item's status — some can have failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        description: One entry per submitted item, in the order sent
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            status:
                              type: string
                              enum: [ok, error, skipped]
                              description: skipped means the item was never attempted, after a halt — see `halted`
                            error:
                              type: object
                              properties:
                                code:
                                  type: string
                                message:
                                  type: string
                      reconciled:
                        type: object
                        description: Rows left pending by an interrupted earlier batch that this call resolved
                        properties:
                          scanned:
                            type: integer
                          applied:
                            type: integer
                          failed:
                            type: integer
                          unknown:
                            type: integer
                      halted:
                        type: string
                        enum: [quota, rateLimit, credits, timeBudget]
                        description: |
                          Present only when the batch stopped early. `quota` is YouTube daily
                          exhaustion, `rateLimit` a transient YouTube throttle that clears in
                          about a minute, `credits` the workspace's own plan balance running
                          out, `timeBudget` the batch running out of wall clock.
                      resetsAt:
                        type: string
                        format: date-time
                        description: Present only for a `quota` halt — daily exhaustion is the only reason with a reset
                  error:
                    type: "null"
                  meta:
                    type: object
                    properties:
                      quotaUnits:
                        type: integer
                        description: 51 per item attempted, plus 1 per row reconciled
                        example: 102
        "400":
          description: Malformed body, more than 40 items, duplicate comment IDs, or a channelId that is not a UC... ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            One of three: the API key is read-only; the key's owner is not an owner
            or admin of the organization (`FORBIDDEN_ROLE`), which this operation
            requires on every surface; or a comment was not authored by `channelId`
            (`AUTHORSHIP_MISMATCH`). In every case nothing was written to YouTube —
            on an authorship mismatch, drop that ID and send the batch again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: A comment in the batch no longer exists (`SNAPSHOT_FAILED`). Nothing was written to YouTube.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: |
            Out of plan credits, or YouTube stopped the batch before any write landed —
            `QUOTA_EXCEEDED` for daily exhaustion (with `meta.resetsAt`), `RATE_LIMITED`
            for a transient throttle that clears in about a minute. Nothing was written
            to YouTube.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          description: |
            `TIME_BUDGET_EXCEEDED` — YouTube was answering too slowly for the batch to
            finish, so it stopped before writing anything. Nothing was written to
            YouTube. Retry with fewer items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /youtube/comments/edits:
    get:
      operationId: listCommentEdits
      summary: List the comment edit log
      description: |
        Returns every comment update and deletion made through VidTempla for this
        workspace, newest first. Each row holds the comment's text as it was before the
        write — the only surviving copy, because YouTube keeps no comment history.

        Only rows with `textSource: "original"` hold restorable text. A `"display"` row
        is the HTML-marked-up rendering of a third-party comment and is an audit record
        only. Restoring is a normal write at 51 units per comment, not a free rollback.

        `status` is `pending` while a write is in flight, then `applied` or `failed`.
        `failed` means the write provably never reached YouTube, so the comment still holds
        `beforeText`. A row left `pending` by an interrupted bulk update is resolved by the
        next bulk update for the same channel. `unknown` is terminal: nothing can establish
        what happened, either because the write's outcome was ambiguous on a path no
        reconciliation reaches, or because reconciliation ran and could not decide. A row
        never claims a write that may not have happened.

        No YouTube call, so no quota is consumed.
      tags: [YouTube Comments]
      x-quota-cost: 0
      parameters:
        - name: channelId
          in: query
          schema:
            type: string
          description: Only return rows written with this channel's token
        - name: commentId
          in: query
          schema:
            type: string
          description: Only return rows for this comment
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque cursor from the previous page's meta.cursor
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
          description: Rows per page (max 100)
      responses:
        "200":
          description: Edit-log rows, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        channelId:
                          type: string
                        commentId:
                          type: string
                        videoId:
                          type: string
                          nullable: true
                        verb:
                          type: string
                          enum: [update, delete]
                        textSource:
                          type: string
                          enum: [original, display]
                          description: original is restorable; display is an audit record only
                        beforeText:
                          type: string
                        afterText:
                          type: string
                          nullable: true
                          description: Null for a delete
                        status:
                          type: string
                          enum: [pending, applied, failed, unknown]
                        source:
                          type: string
                          enum: [mcp, rest, dashboard]
                        createdAt:
                          type: string
                          format: date-time
                  error:
                    type: "null"
                  meta:
                    allOf:
                      - $ref: "#/components/schemas/PaginationMeta"
                      - type: object
                        properties:
                          quotaUnits:
                            type: integer
                            example: 0
        "400":
          description: Invalid cursor or parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── YouTube Thumbnails ─────────────────────────────────────

  /youtube/thumbnails/{videoId}:
    put:
      operationId: uploadThumbnail
      summary: Upload a custom thumbnail
      description: |
        Uploads a custom thumbnail for a YouTube video. Accepts either multipart/form-data
        (with field name "thumbnail") or raw image binary (Content-Type: image/*). Max size 2 MB.
      tags: [YouTube Thumbnails]
      x-quota-cost: 50
      x-requires-write: true
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
          description: YouTube video ID
        - name: channelId
          in: query
          required: true
          schema:
            type: string
          description: YouTube channel ID (for auth)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                thumbnail:
                  type: string
                  format: binary
                  description: Image file (JPEG or PNG, max 2 MB)
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Thumbnail uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: YouTube thumbnail resource
                  error:
                    type: "null"
                  meta:
                    type: object
                    properties:
                      quotaUnits:
                        type: integer
                        example: 50
        "400":
          description: Missing channelId, invalid content type, or file too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientPermissions"
        "429":
          $ref: "#/components/responses/QuotaExceeded"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Analytics ──────────────────────────────────────────────

  /analytics/query:
    post:
      operationId: queryAnalytics
      summary: Flexible YouTube Analytics query
      description: |
        Raw pass-through to the YouTube Analytics API. Read-only despite using POST
        (POST is used because the query parameters can be complex).
        Analytics API uses a separate quota pool from the Data API.
      tags: [Analytics]
      x-quota-cost: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId, startDate, endDate, metrics]
              properties:
                channelId:
                  type: string
                  description: YouTube channel ID
                startDate:
                  type: string
                  format: date
                  description: Start date (YYYY-MM-DD)
                endDate:
                  type: string
                  format: date
                  description: End date (YYYY-MM-DD)
                metrics:
                  type: string
                  description: "Comma-separated metrics (e.g. views,estimatedMinutesWatched,averageViewDuration)"
                dimensions:
                  type: string
                  description: "Comma-separated dimensions (e.g. day, month, country, video)"
                filters:
                  type: string
                  description: "YouTube Analytics filter expression (e.g. video==abc123)"
                sort:
                  type: string
                  description: "Sort field (e.g. -views for descending)"
                maxResults:
                  type: integer
                  description: Maximum number of result rows
            example:
              channelId: "UCxxxxxxxxxxxxxxxxxxxxxx"
              startDate: "2025-01-01"
              endDate: "2025-01-31"
              metrics: "views,estimatedMinutesWatched,averageViewDuration"
              dimensions: "day"
      responses:
        "200":
          description: Analytics query results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: YouTube Analytics API response (columnHeaders + rows)
                  error:
                    type: "null"
                  meta:
                    type: object
                    properties:
                      quotaUnits:
                        type: integer
                        example: 1
                      note:
                        type: string
        "400":
          description: Missing required fields or invalid date format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Analytics scope not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                data: null
                error:
                  code: MISSING_SCOPE
                  message: Analytics scope not authorized for this channel
                  suggestion: "Reconnect your channel from the dashboard to enable analytics (requires yt-analytics.readonly scope)"
                  status: 403
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Usage ──────────────────────────────────────────────────

  /usage:
    get:
      operationId: getUsage
      summary: Get API usage stats
      description: Returns daily request counts and quota usage for the current billing period. Defaults to the current calendar month if no dates are specified.
      tags: [Usage]
      x-quota-cost: 0
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
          description: Start date (YYYY-MM-DD). Defaults to first day of current month.
        - name: endDate
          in: query
          schema:
            type: string
            format: date
          description: End date (YYYY-MM-DD). Defaults to today.
      responses:
        "200":
          description: Usage statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UsageData"
                  error:
                    type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
